# Run unit and contract tests when kit or package code changes. Game content uses the platform compatibility checks.
name: Test kit

on:
  push:
    branches: [main]
    paths:
      - 'games/kit/**'
      - 'packages/*/core/**'
      - 'packages/*/view/**'
      - 'packages/*/test/**'
      - 'packages/*/package.json'
      - 'site/**'
      - '.github/workflows/test-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Plain mistakes and the layering: no domain imports another, the kernel imports none.
      - run: npm run lint:kit
      # Every word the kit's code says has its English in the catalog.
      - run: npm run words -- --check
      - run: npm test
