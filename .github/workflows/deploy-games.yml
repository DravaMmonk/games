# Publish the games site to /games/ (this repository's gh-pages branch). Game content is checked where it is
# changed (the studio and the operation set), and kit code by test-kit.yml: this workflow only builds and publishes.
name: Deploy games

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'packages/**'
      # Design notes and specs are not on the site; the kit's own Markdown is read by its code.
      - '!games/**/*.md'
      - 'games/kit/**/*.md'
      - 'trace-viewer/**'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-games
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trace-viewer/package-lock.json
      - run: npm ci
      - run: npm run build:games
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: trace-viewer/dist-games
          commit_message: 'deploy: games'
          # Keep gh-pages as one commit: the site is rebuilt from main each time, so its old deploys are not kept.
          force_orphan: true
